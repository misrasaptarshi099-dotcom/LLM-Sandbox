databases:
  - name: llm-sandbox-db
    databaseName: llm_sandbox
    plan: free

services:
  - type: web
    name: llm-sandbox-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llm-sandbox-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: EMBEDDED_WORKER
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_GLOBAL_PER_MINUTE
        value: "800"
      - key: RATE_LIMIT_PER_IP_PER_MINUTE
        value: "100"
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: DEV_AUTH_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
